<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SDC 进货跟踪{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <span class="title">SDC 进货跟踪</span>
    <a href="{{ url_for('index') }}">订单</a>
    <a href="{{ url_for('new_order') }}">+ 新增</a>
    <a href="{{ url_for('show_logs') }}">日志</a>
  </header>
  <div class="bar">
    <span>模拟日期：<b>{{ sim_today }}</b></span>
  </div>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
