{% extends "base.html" %}
{% block content %}
{# 店员访问只有店主能用的功能时，统一显示这一页（由 owner_required 装饰器返回） #}
<section class="card narrow center">
  <div class="big-icon"><i data-lucide="lock"></i></div>
  <h1>{{ t('denied.title') }}</h1>
  <p>{{ t('denied.text', what=t(what), name=user.name, role=role_label(user.role)) }}</p>
  <p class="muted">{{ t('denied.hint') }}</p>
  <a class="btn btn-primary" href="{{ back }}"><i data-lucide="arrow-left"></i> {{ t('denied.back') }}</a>
</section>
{% endblock %}
