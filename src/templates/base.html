<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sudahsampai 采购跟进{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <span class="title">Sudahsampai</span>
    <a href="{{ url_for('index') }}">订单</a>
    <a href="{{ url_for('new_order') }}">+ 新增</a>
    <a href="{{ url_for('show_logs') }}">日志</a>
  </header>
  <div class="bar">
    <span>模拟日期：<b>{{ sim_today }}</b></span>
    <form method="post" action="{{ url_for('time_forward') }}">
      <button type="submit">快进 1 天</button>
    </form>
    <form method="post" action="{{ url_for('switch_role') }}">
      角色：
      {% for r in roles %}
        <button type="submit" name="role" value="{{ r }}" class="{{ '' if r == role else 'secondary' }}">{{ r }}</button>
      {% endfor %}
    </form>
  </div>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
